<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* A simple, centered dark-mode layout */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-width: 400px;
        }

        h1 {
            color: #bb86fc;
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        p {
            color: #a0a0a0;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello, World.</h1>
        <p>Welcome to my digital scratchpad. Things are currently under construction.</p>
    </div>

</body>
</html>
